<style>

:root[data-theme="dark"]{--bg:#141417;--card:#1f1f24;--tx:#ecebe6;--mu:#a3a29b;--ac:#8d9bff;--act:#10131f;--bd:#34343a;--hl:#23263a;--ok:#5fd3a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 40px}

.sub{color:var(--mu);font-size:.88rem;margin:2px 0 16px}

.chips{display:flex;gap:6px;margin-bottom:10px}

.btn.o{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}

.rf{margin:0;font:1rem/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}

.fg .u{fill:var(--ac);font-weight:700}

.ra,.da{fill:none;stroke:var(--ac);stroke-width:1.5}

math{math-style:normal;font-size:1.1em}
.exh{font-weight:700;margin:16px 0 8px}

.exr input[disabled]{opacity:.4}
.eq{font-size:1.15rem;margin-top:8px;overflow-x:auto}
.pv{width:100%;border:1px solid var(--bd);border-radius:8px;margin:8px 0;background:#fff;display:block}

<script>
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const nz=r=>{let n=0;while(!n)n=ri(-r,r);return n};
const num=n=>String(n).replace('-','−');
const p=n=>n<0?'('+num(n)+')':num(n);
const ss=(n,s='')=>(n<0?' − ':' + ')+Math.abs(n)+s;
const tm=(n,s)=>(n<0?' − ':' + ')+(Math.abs(n)===1?'':Math.abs(n))+s;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const red=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]};
const frs=(n,d)=>d===1?num(n):num(n)+'/'+d;
const f=x=>String(parseFloat(x.toFixed(2))).replace('.',',');
const sen=x=>Math.sin(x*Math.PI/180),cos=x=>Math.cos(x*Math.PI/180),tg=x=>Math.tan(x*Math.PI/180),dg=x=>x*180/Math.PI;
const NL=String.fromCharCode(10);
const pw=['','x','x²','x³','x⁴'];
const poly=co=>{let s='';const n=co.length-1;co.forEach((c,i)=>{const e=n-i;if(!c)return;const a=Math.abs(c),t=(a===1&&e>0?'':a)+pw[e];s+=s?(c<0?' − ':' + ')+t:(c<0?'−':'')+t;});return s};
const rad=n=>{let s=1;for(let t=2;t*t<=n;t++)if(n%(t*t)===0)s=t;const i=n/(s*s);return i===1?String(s):(s===1?'':s)+'√'+i};
const divs=x=>{const a=Math.abs(x),v=[];for(let i=1;i<=a;i++)if(a%i===0)v.push(i);return v};
const ev=(c,r)=>c.reduce((a,x)=>a*r+x,0);
function ruf(co,r){
  const res=[co[0]],pr=[''];
  for(let i=1;i<co.length;i++){const v=res[i-1]*r;pr.push(v);res.push(co[i]+v);}
  const s=x=>x===''?'':num(x);
  const W=Math.max(...co.map(x=>s(x).length),...res.map(x=>s(x).length),...pr.map(x=>s(x).length))+2,L=num(r).length+3;
  const row=(lab,a)=>lab.padStart(L)+a.map(x=>s(x).padStart(W)).join('');
  return{res,t:row('',co)+NL+row(num(r)+' |',pr)+NL+'─'.repeat(L+W*co.length)+NL+row('',res)};
}
function quad(A,B,C,v){
  const D=B*B-4*A*C,q=4*A*C,sb=['₁','₂'];
  const st=[
    ['Identificamos los coeficientes',`a = ${A}, b = ${num(B)}, c = ${num(C)}`,`Se lee la ecuación como ax² + bx + c = 0 (con ${v} como incógnita) y se toman a, b y c con su signo.`],
    ['Escribimos la fórmula general',`${v} = (−b ± √(b² − 4ac)) / 2a`,'Esta fórmula resuelve cualquier ecuación de 2.º grado.'],
    ['Sustituimos los valores',`${v} = (${B===0?'0':'−'+p(B)} ± √(${p(B)}² − 4·${A}·${p(C)})) / (2·${A})`,'Cada coeficiente va entre paréntesis para no equivocarse con los signos.'],
    ['Calculamos lo que hay dentro de la raíz',`${p(B)}² − 4·${A}·${p(C)} = ${B*B} ${q<0?'+':'−'} ${Math.abs(q)} = ${D}`,D>0?'Es positivo: habrá dos soluciones reales.':D===0?'Es cero: habrá una única solución (doble).':'Es negativo y no existe la raíz de un negativo en ℝ: no hay soluciones reales.']];
  if(D<0){st.push(['Conclusión','<b>No tiene soluciones reales</b>','Una ecuación de 2.º grado con discriminante negativo no tiene soluciones reales.']);return{st,sols:[]};}
  const s=Math.round(Math.sqrt(D)),m=D===0?[[-B,2*A]]:[[-B+s,2*A],[-B-s,2*A]];
  const sols=m.map(([n,d])=>{const[r,e]=red(n,d);return{v:r/e,s:frs(r,e)}});
  if(D===0)st.push(['Calculamos la solución',`${v} = ${num(-B)} / ${2*A} = ${sols[0].s}`,'Con discriminante 0 el ± no cambia nada: las dos soluciones coinciden.']);
  else st.push(['Separamos las dos soluciones',`${v}${sb[0]} = (${num(-B)} + ${s}) / ${2*A} = ${sols[0].s}<br>${v}${sb[1]} = (${num(-B)} − ${s}) / ${2*A} = ${sols[1].s}`,'El símbolo ± da dos soluciones: una sumando la raíz y otra restándola.']);
  return{st,sols};
}
function figOld(S,L,o={}){
  const{a,b,c}=S,cA=(b*b+c*c-a*a)/(2*b*c),sA=Math.sqrt(Math.max(0,1-cA*cA)),K=['A','B','C'];
  const P={A:[0,0],B:[c,0],C:[b*cA,-b*sA]};
  const xs=K.map(k=>P[k][0]),ys=K.map(k=>P[k][1]),x0=Math.min(...xs),y0=Math.min(...ys);
  const W=300,H=190,m=36,w=Math.max(...xs)-x0||1,h=Math.max(...ys)-y0||1,sc=Math.min((W-2*m)/w,(H-2*m)/h);
  const Q={};K.forEach(k=>{Q[k]=[m+(P[k][0]-x0)*sc+(W-2*m-w*sc)/2,m+(P[k][1]-y0)*sc+(H-2*m-h*sc)/2]});
  const g=[0,1].map(i=>(Q.A[i]+Q.B[i]+Q.C[i])/3);
  const mv=(pt,d)=>{const dx=pt[0]-g[0],dy=pt[1]-g[1],l=Math.hypot(dx,dy)||1;return[pt[0]+dx/l*d,pt[1]+dy/l*d]};
  const mid=(u,v)=>[(Q[u][0]+Q[v][0])/2,(Q[u][1]+Q[v][1])/2];
  const tx=(pt,s,cl)=>s?`<text x='${pt[0].toFixed(1)}' y='${(pt[1]+4).toFixed(1)}' text-anchor='middle' class='${cl||(String(s).includes('?')?'u':'')}'>${s}</text>`:'';
  let s=`<svg viewBox='0 0 ${W} ${H}' class='fg'><polygon class='tr' points='${K.map(k=>Q[k].map(z=>z.toFixed(1)).join(',')).join(' ')}'/>`;
  if(o.right){
    const V=Q[o.right],[u,r]=K.filter(k=>k!==o.right).map(k=>{const dx=Q[k][0]-V[0],dy=Q[k][1]-V[1],l=Math.hypot(dx,dy)||1;return[dx/l*11,dy/l*11]});
    s+=`<polyline class='ra' points='${V[0]+u[0]},${V[1]+u[1]} ${V[0]+u[0]+r[0]},${V[1]+u[1]+r[1]} ${V[0]+r[0]},${V[1]+r[1]}'/>`;
  }
  if(o.alt){s+=`<line class='da' x1='${Q.C[0]}' y1='${Q.C[1]}' x2='${Q.C[0]}' y2='${Q.A[1]}'/>`+tx([Q.C[0]+22,(Q.C[1]+Q.A[1])/2],L.w);}
  s+=tx(mv(mid('B','C'),16),L.a)+tx(mv(mid('C','A'),16),L.b)+tx(mv(mid('A','B'),16),L.c);
  K.forEach(k=>{
    s+=tx(mv(Q[k],15),L[k],'v');
    if(L['g'+k]){const dx=g[0]-Q[k][0],dy=g[1]-Q[k][1],l=Math.hypot(dx,dy)||1;s+=tx([Q[k][0]+dx/l*32,Q[k][1]+dy/l*32],L['g'+k]);}
  });
  return s+'</svg>';
}
const T={
cuadratica(d){
  let A,B,C;
  if(d===3&&Math.random()<.25){A=ri(1,2);B=ri(-3,3);C=Math.ceil(B*B/(4*A))+ri(1,4);}
  else{const a1=d===1?1:ri(1,d),a2=d===3?ri(1,3):1,r=d===1?5:8,q1=nz(r),q2=nz(r);A=a1*a2;B=-(a1*q2+a2*q1);C=q1*q2;}
  const eq=`${A===1?'':A}x²${B?tm(B,'x'):''}${ss(C)} = 0`,Q=quad(A,B,C,'x'),st=Q.st.slice();
  if(Q.sols.length)st.push(['Escribimos las soluciones',Q.sols.map(s=>`<b>x = ${s.s}</b>`).join(' y '),'Son los valores de x que cumplen la ecuación.']);
  return{q:`Resuelve en ℝ: ${eq}`,steps:st};
},
bicuadrada(d){
  const k=d===3?ri(2,3):1,sq=[1,4,9,16];let t1,t2;
  do{t1=d===1?sq[ri(0,3)]:ri(1,9);t2=d===1?sq[ri(0,3)]:d===2?-ri(1,9):(Math.random()<.5?1:-1)*ri(1,9);}while(t1===t2);
  const A=k,B=-k*(t1+t2),C=k*t1*t2,lead=A===1?'':A;
  const eq=`${lead}x⁴${B?tm(B,'x²'):''}${ss(C)} = 0`,eqt=`${lead}t²${B?tm(B,'t'):''}${ss(C)} = 0`;
  const {st,sols}=quad(A,B,C,'t'),xs=[];
  const ln=sols.map(s=>{if(s.v>0){xs.push(rad(s.v),'−'+rad(s.v));return `x² = ${s.s} → x = ±√${s.s} = ±${rad(s.v)}`;}return `x² = ${num(s.v)} → x = ±√(${num(s.v)}) → no existe en ℝ`;});
  return{q:`Resuelve en ℝ: ${eq}`,steps:[
    ['Hacemos el cambio de variable',`t = x² → ${eqt}`,'Como solo aparecen x⁴ y x², llamando t a x² queda una ecuación de 2.º grado en t. A partir de aquí se resuelve igual que cualquier ecuación de 2.º grado.'],
    ...st,
    ['Deshacemos el cambio x² = t',ln.join('<br>'),'Cada t positivo da dos valores de x (la raíz y su opuesta). Si t es negativo no hay raíz real.'],
    ['Escribimos las soluciones',xs.length?`<b>x = ${xs.join(', ')}</b>`:'<b>No tiene soluciones reales</b>',xs.length?`Tiene ${xs.length} soluciones reales.`:'Ningún valor de t es positivo, así que no hay soluciones reales.']]};
},
ruffini(d){
  const n=d===3?4:3,mx=d===1?3:d===2?5:4,roots=[];
  while(roots.length<n){const r=nz(mx);if(d===1&&roots.includes(r))continue;roots.push(r);}
  let co=[1];
  roots.forEach(r=>{const nc=Array(co.length+1).fill(0);co.forEach((c,i)=>{nc[i]+=c;nc[i+1]-=r*c;});co=nc;});
  const steps=[
    ['Ordenamos el polinomio y completamos los huecos',`P(x) = ${poly(co)}<br>Coeficientes: ${co.map(num).join('  ')}`,'Se ordena de mayor a menor grado. Si faltara algún término se escribiría un 0 en su lugar, para no descolocar la tabla de Ruffini.'],
    ['Buscamos las posibles raíces enteras',`Término independiente: ${num(co[co.length-1])}<br>Divisores: ±${divs(co[co.length-1]).join(', ±')}`,'Si un polinomio con coeficientes enteros tiene una raíz entera, esa raíz divide a su término independiente.']];
  let cur=co.slice(),first=true;const found=[];
  while(cur.length>3){
    const cd=divs(cur[cur.length-1]).flatMap(x=>[x,-x]),i=cd.findIndex(x=>ev(cur,x)===0),r=cd[i];
    let ls=cd.slice(0,i+1).map(x=>{const v=ev(cur,x);return `P(${num(x)}) = ${num(v)} → ${v?'no es raíz':'es raíz'}`;});
    if(ls.length>6)ls=['…',...ls.slice(-5)];
    steps.push(['Probamos los divisores en orden',ls.join('<br>'),first?'Evaluamos el polinomio en cada divisor (1, −1, 2, −2…). Si da 0, ese número es raíz; si no, se descarta.':'Repetimos con el cociente: probamos los divisores de su término independiente.']);

    steps.push([`Aplicamos Ruffini con x = ${num(r)}`,`<pre class='rf'>${u.t}</pre>`,first?`Se baja el primer coeficiente, se multiplica por ${num(r)} y se suma al siguiente, y así hasta el final. El último número es el resto: como vale 0, x = ${num(r)} es raíz. Los demás son los coeficientes del cociente.`:'Mismo procedimiento. El resto vuelve a ser 0 y el cociente baja un grado.']);

  const Q=quad(1,cur[1],cur[2],'x');steps.push(...Q.st);
  Q.sols.length===1?found.push(Q.sols[0].v,Q.sols[0].v):found.push(...Q.sols.map(s=>s.v));
  const fac=found.map(r=>r<0?`(x + ${-r})`:`(x − ${r})`).join(''),uniq=[...new Set(found)];
  steps.push(['Escribimos la factorización y las soluciones',`${poly(co)} = ${fac} = 0<br><b>x = ${uniq.map(num).join(', ')}</b>`,'Un producto es 0 cuando algún factor es 0, así que cada raíz da una solución.'+(uniq.length<found.length?' Las raíces repetidas se escriben una vez, pero cuentan con su multiplicidad.':'')]);
  return{q:`Resuelve: ${poly(co)} = 0`,steps};
},
razones(d){
  const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]],tr=TR[ri(0,d===1?1:4)],k=d===1?1:ri(1,2);
  const [a,b]=Math.random()<.5?[tr[0]*k,tr[1]*k]:[tr[1]*k,tr[0]*k],c=tr[2]*k,al=dg(Math.atan2(a,b)),hid=d>1;
  const eq=(n,m)=>{const [r,s]=red(n,m),w=n+'/'+m,v=frs(r,s);return w===v?w:w+' = '+v};
  const S={a,b,c},o={right:'C'},N={A:'A',B:'B',C:'C'};
  const fq=fig(S,{...N,a:`${a}`,b:`${b}`,c:hid?'c = ?':`${c}`,gA:'α'},o),fs=fig(S,{...N,a:`${a}`,b:`${b}`,c:`${c}`,gA:d===3?`α = ${f(al)}°`:'α'},o);
  const steps=[['Identificamos los lados respecto al ángulo α',`Cateto opuesto: a = ${a}<br>Cateto contiguo: b = ${b}<br>Hipotenusa: c ${hid?'= ?':'= '+c}`,'El opuesto está enfrente de α, el contiguo toca a α, y la hipotenusa es el lado enfrente del ángulo recto.']];

  return{q:`En el triángulo rectángulo de la figura, calcula sen α, cos α y tg α${d===3?' y el ángulo α':''}.`,fq,fs,steps};

rectangulo(d){
  const A=d===1?[30,45,60][ri(0,2)]:ri(20,70),t1=d===1||Math.random()<.5,B=90-A;

function fig(S,L,o={}){

      }
      const nk=L[k];
      if(nk){const w=TW(nk),d1=(extra?extra+6:10)+w/2*Math.abs(bs[0])+7*Math.abs(bs[1]);labs.push({x:Q[k][0]-bs[0]*d1,y:Q[k][1]-bs[1]*d1,s:nk,w,cl:'v'});}
    });
    if(o.alt&&L.w){const fx=Q.C[0],fy=Q.A[1],w=TW(L.w),md=Q.C[1]+.72*(fy-Q.C[1]),rs=Q.B[0]-fx,ls=fx-Q.A[0];labs.push({x:rs>=ls?fx+6+w/2:fx-6-w/2,y:md,s:L.w,w,cl:''});}
    for(let it=0;it<14;it++){
      let moved=false;

        const A=labs[i],B=labs[j],ox=(A.w+B.w)/2+2-Math.abs(A.x-B.x),oy=14-Math.abs(A.y-B.y);
        if(ox>0&&oy>0){moved=true;if(oy<=ox){const sg=A.y<=B.y?-1:1;A.y+=sg*oy/2;B.y-=sg*oy/2;}else{const sg=A.x<=B.x?-1:1;A.x+=sg*ox/2;B.x-=sg*ox/2;}}
      }

}
async function figPdf(svg,wd){
  const s=svg.replace('<svg ',"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190' ").replace('</svg>',`<style>.tr{fill:#eef0ff;stroke:#3b4cca;stroke-width:2;stroke-linejoin:round}.ra,.da{fill:none;stroke:#3b4cca;stroke-width:1.5}.da{stroke-dasharray:4 3}text{fill:#111;font:13px Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.u{fill:#3b4cca;font-weight:700}.v{fill:#666;font-weight:700}</style></svg>`);
  const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);});
  if(!im)return;
  const h=wd*190/300;need(h+8);CX.drawImage(im,MG+(CW-wd)/2,Y,wd,h);Y+=h+8;
}
function pdfFrom(pages){
  const enc=s=>new TextEncoder().encode(s),parts=[],off=[];let len=0;
  const put=b=>{const u=typeof b==='string'?enc(b):b;parts.push(u);len+=u.length;};
  const obj=(id,body)=>{off[id]=len;put(id+' 0 obj'+NL);put(body);put(NL+'endobj'+NL);};
  const n=pages.length;
  put('%PDF-1.4'+NL);
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`);
  pages.forEach((cv,i)=>{
    const bin=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(bin.length);
    for(let q=0;q<bin.length;q++)u[q]=bin.charCodeAt(q);
    const id=3+3*i,cont='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Contents ${id+1} 0 R /Resources << /XObject << /Im0 ${id+2} 0 R >> >> >>`);
    obj(id+1,`<< /Length ${cont.length} >>${NL}stream${NL}${cont}${NL}endstream`);
    off[id+2]=len;put(`${id+2} 0 obj${NL}<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${u.length} >>${NL}stream${NL}`);put(u);put(`${NL}endstream${NL}endobj${NL}`);
  });
  const xr=len,total=3+3*n;
  put(`xref${NL}0 ${total}${NL}0000000000 65535 f ${NL}`);
  for(let i=1;i<total;i++)put(String(off[i]).padStart(10,'0')+' 00000 n '+NL);
  put(`trailer${NL}<< /Size ${total} /Root 1 0 R >>${NL}startxref${NL}${xr}${NL}%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function makePdf(btn){
  btn.disabled=true;btn.textContent='Generando PDF…';
  try{
    PG=[];newPage();
    const dl=['Fácil','Media','Difícil','Mixta'][exDif?exDif-1:3],ds=['Fácil','Media','Difícil'];
    para('<b>Examen de Matemáticas I</b>',22,{after:2});
    para(`1.º de Bachillerato (Ciencias y Tecnología) · ${exam.length} ejercicios · Dificultad: ${dl}`,12,{col:'#666',after:8});
    para('Nombre: ______________________________   Fecha: ______________',13,{after:14});
    for(let i=0;i<exam.length;i++){
      const e=exam[i];need(110);
      para(`${e.f} · ${ds[e.d-1]}`,10.5,{col:'#888'});
      para(`<b>${i+1}.</b> ${mx(e.o.q)}`,14.5,{after:6});
      if(e.o.fq&&!HT.includes(e.t))await figPdf(e.o.fq,230);
      Y+=34;
    }
    if($('exSolPdf').checked){
      newPage();para('<b>Soluciones</b>',20,{after:10});
      for(let i=0;i<exam.length;i++){
        const e=exam[i];need(90);
        para(`<b>${i+1}. ${e.f}</b>`,13.5,{after:3});
        for(let k=0;k<e.o.steps.length;k++){
          const s=e.o.steps[k];
          para(`<b>Paso ${k+1}.</b> ${mx(s[0])}`,12.5,{x:MG+10,w:CW-10});
          para(mx(s[1]),13.5,{x:MG+28,w:CW-28,after:1});
          para(`¿Por qué? ${mx(s[2])}`,10.5,{x:MG+28,w:CW-28,col:'#666',after:4});
        }
        if(e.o.fs)await figPdf(e.o.fs,200);
        Y+=12;
      }
    }
    lastPdf=pdfFrom(PG);
    $('exPrev').innerHTML=`<div class='tag' style='margin:14px 0 6px'>Vista previa del PDF · ${PG.length} páginas</div><button class='btn' data-a='dl'>Descargar PDF</button>`+PG.map(c=>`<img class='pv' src='${c.toDataURL('image/jpeg',.8)}'>`).join('');
  }catch(err){
    $('exPrev').innerHTML="<p class='sub' style='margin-top:12px'>No se ha podido generar el PDF en este navegador.</p>";
  }
  btn.disabled=false;btn.textContent='Generar PDF del examen';
}
async function dlPdf(){
  if(!lastPdf)return;
  const name='examen-matematicas.pdf';
  try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:name,data:lastPdf});return;}}}catch(err){return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(lastPdf);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
$('exCats').onchange=e=>{const t=e.target;if(t.type==='checkbox')$('n_'+t.id.slice(2)).disabled=!t.checked;};
$('exOut').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=b.dataset.a,i=b.dataset.i;
  if(a==='hint'){$('h'+i).innerHTML=exam[+i].o.fq;b.classList.add('hid');}
  else if(a==='sol'){const hid=$('s'+i).classList.toggle('hid');b.textContent=hid?'Ver solución':'Ocultar solución';}
  else if(a==='pdf'){makePdf(b);}else if(a==='dl'){dlPdf();}else if(a==='all'){
    const show=b.dataset.on!=='1';b.dataset.on=show?'1':'0';b.textContent=show?'Ocultar todas las soluciones':'Mostrar todas las soluciones';
    exam.forEach((_,k)=>$('s'+k).classList.toggle('hid',!show));
    $('exOut').querySelectorAll("button[data-a='sol']").forEach(x=>{x.textContent=show?'Ocultar solución':'Ver solución';});
  }
};
tog('modes',c=>{const ex=c.dataset.m==='ex';$('pEj').classList.toggle('hid',ex);$('pEx').classList.toggle('hid',!ex);});
tog('exDif',c=>{exDif=+c.dataset.d;});
$('exGo').onclick=genExam;
buildCats();
fill();gen();
</script>
